<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Holy Wars — Mapa')}"></head>
<body>
<header th:replace="~{fragments/layout :: header()}"></header>
<main>
<h1>Mapa del mundo</h1>
<table>
    <tr th:each="row : ${rows}">
        <td th:each="cell : ${row}" th:class="${cell.island} ? 'island' : 'sea'">
            <th:block th:if="${cell.island}">
                <a class="island-link" th:href="@{/islands/{id}(id=${cell.islandId})}">
                    <img th:src="${cell.iconPath}" alt=""/>
                    <span th:text="${cell.islandName}"></span>
                </a>
                <div th:if="${cell.villageCountLabel}" th:text="${cell.villageCountLabel}"></div>
            </th:block>
        </td>
    </tr>
</table>
</main>
</body>
</html>
