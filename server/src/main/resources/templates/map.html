<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Holy Wars — Mapa')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topBar()}"></header>
    <div class="shell-stage map-stage">
        <h1 class="visually-hidden">Mapa del mundo</h1>
        <table>
            <tr th:each="row : ${rows}">
                <td th:each="cell : ${row}" th:class="${cell.island} ? 'island' : 'sea'">
                    <th:block th:if="${cell.island}">
                        <a class="island-link" th:href="@{/islands/{id}(id=${cell.islandId})}">
                            <img th:src="${cell.iconPath}" alt=""/>
                            <span th:text="${cell.islandName}"></span>
                        </a>
                        <div th:if="${cell.villageCountLabel}" th:text="${cell.villageCountLabel}"></div>
                    </th:block>
                </td>
            </tr>
        </table>
        <div th:replace="~{fragments/layout :: capitalHeader(header=${header})}"></div>
        <nav th:replace="~{fragments/layout :: breadcrumb(breadcrumb=${breadcrumb})}"></nav>
        <div th:replace="~{fragments/layout :: frieze()}"></div>
    </div>
    <footer th:replace="~{fragments/layout :: compassFooter(header=${header})}"></footer>
</div>
</body>
</html>
