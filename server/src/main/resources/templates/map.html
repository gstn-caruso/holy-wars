<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead('Holy Wars — Mapa')}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<h1>Mapa del mundo</h1>
<table>
    <tr th:each="row : ${rows}">
        <td th:each="cell : ${row}" th:class="${cell.sea()} ? 'sea' : 'island'">
            <a th:if="${!cell.sea()}"
               th:href="@{/islands/{id}(id=${cell.islandId()})}"
               th:text="${cell.islandName() + ' (' + cell.resource() + ')'}">Isla</a>
            <span th:if="${!cell.sea() and cell.townCount() > 0}"
                  th:text="${cell.townCount()} + (${cell.townCount()} == 1 ? ' aldea' : ' aldeas')">n aldeas</span>
        </td>
    </tr>
</table>
</body>
</html>
