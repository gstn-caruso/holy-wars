<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead(${island.name()})}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<h1 th:text="${island.name()}">Isla</h1>
<p th:text="'Coordenada: (' + ${island.coordinate().x()} + ', ' + ${island.coordinate().y()} + ')'">Coordenada</p>
<p th:text="'Recurso: ' + ${island.resource()}">Recurso</p>
<ul>
    <li th:each="plot : ${plots}">
        <span th:text="'Parcela ' + ${plot.number()} + ' — '">Parcela</span>
        <span th:unless="${plot.occupied()}">Libre</span>
        <span th:if="${plot.occupied()}">
            Ocupada:
            <a th:href="@{/towns/{id}(id=${plot.townId()})}"
               th:text="${plot.occupantLabel()}">Aldea</a>
        </span>
    </li>
</ul>
</body>
</html>
