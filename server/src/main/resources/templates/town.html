<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead(${town.name()})}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: resourceBar(${resourceBar})}"></div>
<h1 th:text="${town.name()}">Aldea</h1>
<p th:text="'Dueño: ' + ${town.ownerName()}">Dueño</p>
<p>
    Isla:
    <a th:href="@{/islands/{id}(id=${town.islandId()})}" th:text="${town.islandName()}">Isla</a>
</p>
<p th:text="'Parcela: ' + ${town.plotNumber()}">Parcela</p>
<svg th:attr="viewBox='0 0 ' + ${town.scene().width()} + ' ' + ${town.scene().height()}" class="town-scene">
    <image th:href="@{/img/town-scene.svg}" x="0" y="0" th:width="${town.scene().width()}" th:height="${town.scene().height()}"/>
    <image th:each="plot : ${town.scene().plots()}"
           th:href="@{'/img/' + ${plot.sprite()}}"
           th:attr="x=${plot.x()},y=${plot.y()},width=${plot.width()},height=${plot.height()}">
        <title th:text="${plot.label()}"></title>
    </image>
</svg>
<p class="error" th:if="${error}" th:text="${error}">Error</p>
<div class="build-menu" th:each="option : ${buildOptions}">
    <form method="post" th:action="@{/towns/{id}/slots/{position}/build(id=${town.id()}, position=${option.position()})}">
        <label th:text="${option.slotLabel()}">Parcela</label>
        <select name="type">
            <option th:each="choice : ${option.choices()}"
                    th:value="${choice.type()}"
                    th:text="${choice.name()} + ' · ' + ${choice.wood()} + ' madera, ' + ${choice.luxury()} + ' lujo, ' + ${choice.minutes()} + ' min'">
                Edificio
            </option>
        </select>
        <button type="submit">Construir</button>
    </form>
</div>
</body>
</html>
