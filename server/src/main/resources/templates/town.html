<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead(${town.name()})}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: resourceBar(${resourceBar})}"></div>
<h1 th:text="${town.name()}">Aldea</h1>
<p th:text="'Dueño: ' + ${town.ownerName()}">Dueño</p>
<p>
    Isla:
    <a th:href="@{/islands/{id}(id=${town.islandId()})}" th:text="${town.islandName()}">Isla</a>
</p>
<p th:text="'Parcela: ' + ${town.plotNumber()}">Parcela</p>
<svg th:attr="viewBox='0 0 ' + ${town.sceneWidth()} + ' ' + ${town.sceneHeight()}" class="town-scene">
    <image th:href="@{/img/town-scene.svg}" x="0" y="0" th:width="${town.sceneWidth()}" th:height="${town.sceneHeight()}"/>
    <image th:each="plot : ${town.plots()}"
           th:href="@{'/img/' + ${plot.sprite()}}"
           th:attr="x=${plot.x()},y=${plot.y()},width=${plot.width()},height=${plot.height()}">
        <title th:text="${plot.label()}"></title>
    </image>
</svg>
</body>
</html>
